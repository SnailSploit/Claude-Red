name: Skill Review & Optimize
on:
  pull_request:
    paths: ['**/SKILL.md']
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@90e919d50ecb2dd11e07d69ef1440e7b2716189b
        with:
          optimize: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
